# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).

complexity:
  # Connector classes implement wide SPI interfaces, so a function count limit is noise.
  TooManyFunctions:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 160
  # Type-dispatch functions return once per `when` branch.
  ReturnCount:
    active: false
